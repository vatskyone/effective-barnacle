<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEB-1 Hardware Model</title>
<meta name="description" content="A detailed three.js model of a physical WEB-1 synthesizer, with the list of 3D-printed parts, the hardware, wiring, software and assembly steps.">
<style>
:root{--bg:#d9dad6;--bg2:#ecedea;--panel:#f6f6f3;--ink:#2b2c2e;--hint:#6c6d6a;--line:#d5d6d1;--acc:#ff6427;--b:#3f7fe8;--g:#2fb673;--chip:#e7e8e4;--code:#1b1c1e;--codeink:#e6e6e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--bg2:#1b1c1f;--panel:#18191b;--ink:#e6e6e1;--hint:#8f908c;--line:#2c2d30;--chip:#25262a;--code:#0d0e0f;--codeink:#e6e6e1}}
:root[data-theme="dark"]{--bg:#121315;--bg2:#1b1c1f;--panel:#18191b;--ink:#e6e6e1;--hint:#8f908c;--line:#2c2d30;--chip:#25262a;--code:#0d0e0f;--codeink:#e6e6e1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 13px/1.45 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 460px;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:300 20px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.04em;margin:0}
header .sub{color:var(--hint);font-size:12px}
header .spacer{flex:1}
header a.back{color:var(--ink);text-decoration:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
header a.back:hover{color:var(--acc);border-color:var(--acc)}
#view{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--bg2),var(--bg))}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#views{left:12px;top:12px;right:12px}
#opts{left:12px;bottom:12px;right:12px;justify-content:flex-start}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg button,.btn{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:12px;padding:5px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button:hover,.btn:hover{background:var(--chip)}
.seg button.on{background:var(--ink);color:var(--panel)}
.chk{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);margin:0}
.rng{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:12px}
.rng input{width:120px;accent-color:var(--acc)}
#tip{position:absolute;pointer-events:none;background:rgba(20,20,22,.92);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;display:none;max-width:280px;z-index:3}
#tip b{color:var(--acc);font-weight:600;margin-right:4px}
#sel{position:absolute;right:12px;top:56px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;display:none;max-width:min(420px,calc(100% - 24px))}
#sel b{color:var(--acc)}
#sel button{margin-left:6px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{appearance:none;border:0;background:none;color:var(--hint);font:inherit;font-size:12.5px;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.pane{overflow:auto;padding:14px 16px 40px;flex:1;display:none}
.pane.on{display:block}
.pane h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px;font-weight:600}
.pane h2:first-child{margin-top:2px}
.pane p{margin:6px 0;color:var(--ink)}
.pane .note{color:var(--hint);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--hint);font-weight:500;padding:4px 6px 4px 0;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--panel)}
td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr[data-part]{cursor:pointer}
tr[data-part]:hover td{background:var(--chip)}
tr.hl td{background:color-mix(in srgb,var(--acc) 16%,transparent)}
td.id{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
td.q{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--hint);margin-top:2px}
a.buy{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--acc);text-decoration:none;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:999px;padding:1px 8px}
a.buy:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.spec{background:var(--bg2);border-radius:9px;padding:8px 10px}
.spec .k{color:var(--hint);font-size:11px}
.spec .v{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
pre{background:var(--code);color:var(--codeink);border-radius:9px;padding:10px 12px;overflow:auto;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0 4px;position:relative;max-height:420px}
.cp{position:relative}
.cp .copy{position:absolute;right:6px;top:6px;z-index:1;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #444;background:#2a2b2e;color:#ddd;cursor:pointer}
ol{padding-left:20px;margin:6px 0}
ol li{margin:0 0 8px}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);padding:1px 4px;border-radius:4px}
.total td{font-weight:600}
@media (max-width:920px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:52px 62vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  header .sub{display:none}
  .rng input{width:80px}
}
</style>

<script>
/* Source files shown in the Software tab. Kept as plain strings so they can be copied as-is. */
window.SRC = {
hw: `<!doctype html>
<html><head><meta charset="utf-8"><title>WEB-1 hardware</title>
<!-- Save as hw.html next to index.html. Runs WEB-1 in a hidden frame, shows only its
     screen on the 800x480 panel, and links the controller (USB serial) to the app. -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
#f{position:fixed;inset:0;width:100%;height:100%;border:0}
#out{position:fixed;inset:0;width:100vw;height:100vh;background:#000;pointer-events:none}
#go{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;font:16px sans-serif;padding:12px 20px;cursor:default}</style></head>
<body><iframe id="f" src="index.html?web1"></iframe><canvas id="out" width="800" height="480"></canvas><button id="go">connect controller</button>
<script>
// The case window shows a 94.7 x 41.5 mm band of the panel: move it with BAND_TOP.
var BAND_TOP = 20, BAND_H = 369;
// LED chain order (must match code.py): 29 key lights, then 5 VU lights (top = red)
var ACTS = ['fx','tempo','metro','synth','drum','tape','mixer','t0','t1','t2','t3','s0','s1','s2','s3','s4','s5','s6','s7','seq','lift','drop','loop','rec','play','stop','left','right','shift'];
var f = document.getElementById('f'), out = document.getElementById('out'), g = out.getContext('2d');
var W = null, writer = null, lastLed = '';
f.addEventListener('load', function () {
  W = f.contentWindow; W.focus();
  setInterval(function () { if (document.activeElement !== f) W.focus(); }, 2000);
  requestAnimationFrame(draw); setInterval(leds, 50); connect();
});
function draw() {
  var s = f.contentDocument.getElementById('scr');
  g.fillStyle = '#000'; g.fillRect(0, 0, 800, 480);
  if (s && s.width) {
    var h = Math.min(BAND_H, 800 * s.height / s.width), w = h * s.width / s.height;
    g.drawImage(s, (800 - w) / 2, BAND_TOP + (BAND_H - h) / 2, w, h);
  }
  requestAnimationFrame(draw);
}
function fire(el, type, init) {
  var C = type.indexOf('pointer') === 0 ? PointerEvent : type === 'wheel' ? WheelEvent : MouseEvent;
  el.dispatchEvent(new C(type, Object.assign({ bubbles: true, cancelable: true }, init || {})));
}
// Lines from the Pico: K <semitone 0-23> <1|0> · E <knob 0-3> <steps> · P <knob 0-3> · V <0-1000>
function onLine(line) {
  var p = line.trim().split(' '), i = +p[1], el;
  if (p[0] === 'K') { el = W.eval('keyEl')[i]; if (el) fire(el, p[2] === '1' ? 'pointerdown' : 'pointerup', { pointerId: 10 + i }); }
  else if (p[0] === 'E') { el = W.eval('encEl')[i]; if (el) fire(el, 'wheel', { deltaY: -(+p[2]) * 45 }); }
  else if (p[0] === 'P') { el = W.eval('encEl')[i]; if (el) fire(el, 'dblclick'); }
  else if (p[0] === 'V') { var cur = W.eval('S.ms[0]'); fire(W.eval('volEl'), 'wheel', { deltaY: -(i / 1000 - cur) * 1500 }); }
}
async function connect() {
  if (!('serial' in navigator)) return;
  var ports = await navigator.serial.getPorts();
  if (ports[0]) return open(ports[0]);
  var b = document.getElementById('go'); b.style.display = 'block';
  b.onclick = async function () { var p = await navigator.serial.requestPort(); b.style.display = 'none'; open(p); };
}
async function open(port) {
  await port.open({ baudRate: 115200 });
  writer = port.writable.getWriter();
  var rd = port.readable.pipeThrough(new TextDecoderStream()).getReader(), buf = '', n;
  for (;;) {
    var r = await rd.read(); if (r.done) break; buf += r.value;
    while ((n = buf.indexOf('\\n')) >= 0) { onLine(buf.slice(0, n)); buf = buf.slice(n + 1); }
  }
}
function hex(c) { var m = c.match(/[\\d.]+/g) || [0, 0, 0]; return m.slice(0, 3).map(function (x) { return ('0' + Math.round(+x).toString(16)).slice(-2); }).join(''); }
function leds() {
  if (!writer) return;
  var d = f.contentDocument, s = 'L';
  ACTS.forEach(function (a) {
    var k = d.querySelector('.k[data-a="' + a + '"]');
    s += k && k.classList.contains('lit') ? hex(getComputedStyle(k.querySelector('.led')).backgroundColor) : '000000';
  });
  d.querySelectorAll('.vu').forEach(function (v) { s += v.classList.contains('on') ? (v.classList.contains('r') ? 'ff2010' : 'ffffff') : '000000'; });
  if (s !== lastLed) { lastLed = s; writer.write(new TextEncoder().encode(s + '\\n')); }
}
<\/script></body></html>`,
boot: `# boot.py: one USB serial port for data (no REPL), plus the default USB keyboard
import usb_cdc
usb_cdc.enable(console=False, data=True)`,
code: `# code.py: WEB-1 controller for Raspberry Pi Pico (CircuitPython 9)
# Needs lib/adafruit_hid and lib/neopixel.mpy from the Adafruit CircuitPython bundle.
import board, keypad, rotaryio, analogio, neopixel, usb_cdc, usb_hid
from adafruit_hid.keyboard import Keyboard
from adafruit_hid.keycode import Keycode as K

ROWS = (board.GP0, board.GP1, board.GP2, board.GP3, board.GP4, board.GP5, board.GP6, board.GP7)
COLS = (board.GP8, board.GP9, board.GP10, board.GP11, board.GP12, board.GP13, board.GP14, board.GP15)

# Matrix slot n sits at row n // 8, column n % 8 (see the Wiring tab).
# nX = musical key, X = semitone 0-23 from the lowest C. eX = push on knob X.
SLOTS = ("fx", "tempo", "metro", "synth", "drum", "tape", "mixer", "t0",
         "t1", "t2", "t3", "s0", "s1", "s2", "s3", "s4",
         "s5", "s6", "s7", "seq", "lift", "drop", "loop", "rec",
         "play", "stop", "left", "right", "shift", "n0", "n2", "n4",
         "n5", "n7", "n9", "n11", "n12", "n14", "n16", "n17",
         "n19", "n21", "n23", "n1", "n3", "n6", "n8", "n10",
         "n13", "n15", "n18", "n20", "n22", "e0", "e1", "e2",
         "e3")

# Function keys type the same shortcuts as the desktop app.
HID = {"fx": K.I, "tempo": K.MINUS, "metro": K.GRAVE_ACCENT, "seq": K.EQUALS,
       "synth": K.Z, "drum": K.X, "tape": K.C, "mixer": K.V,
       "t0": K.B, "t1": K.N, "t2": K.M, "t3": K.COMMA,
       "s0": K.ONE, "s1": K.TWO, "s2": K.THREE, "s3": K.FOUR,
       "s4": K.FIVE, "s5": K.SIX, "s6": K.SEVEN, "s7": K.EIGHT,
       "lift": K.LEFT_BRACKET, "drop": K.RIGHT_BRACKET, "loop": K.Q,
       "rec": K.R, "play": K.SPACE, "stop": K.ENTER,
       "left": K.LEFT_ARROW, "right": K.RIGHT_ARROW, "shift": K.LEFT_SHIFT}

matrix = keypad.KeyMatrix(ROWS, COLS, columns_to_anodes=True)
kbd = Keyboard(usb_hid.devices)
ser = usb_cdc.data
encs = [rotaryio.IncrementalEncoder(a, b, divisor=2) for a, b in
        ((board.GP16, board.GP17), (board.GP18, board.GP19),
         (board.GP20, board.GP21), (board.GP22, board.GP27))]
last = [e.position for e in encs]
pot = analogio.AnalogIn(board.GP26)
vol = -100
leds = neopixel.NeoPixel(board.GP28, 34, brightness=0.25, auto_write=False)
buf = ""

def send(s):
    if ser and ser.connected:
        ser.write((s + "\\n").encode())

while True:
    ev = matrix.events.get()
    while ev:
        n = ev.key_number
        name = SLOTS[n] if n < len(SLOTS) else ""
        if name in HID:
            if ev.pressed:
                kbd.press(HID[name])
            else:
                kbd.release(HID[name])
        elif name.startswith("n"):
            send("K %s %d" % (name[1:], 1 if ev.pressed else 0))
        elif name.startswith("e") and ev.pressed:
            send("P " + name[1:])
        ev = matrix.events.get()

    for i, e in enumerate(encs):
        p = e.position
        if p != last[i]:
            send("E %d %d" % (i, p - last[i]))
            last[i] = p

    v = pot.value * 1000 // 65535
    if abs(v - vol) > 4:
        vol = v
        send("V %d" % v)

    if ser and ser.in_waiting:
        buf += ser.read(ser.in_waiting).decode()
        while "\\n" in buf:
            line, buf = buf.split("\\n", 1)
            if line.startswith("L") and len(line) >= 1 + 34 * 6:
                for i in range(34):
                    h = line[1 + i * 6: 7 + i * 6]
                    leds[i] = (int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16))
                leds.show()`,

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ───────────────────────── Units and layout ─────────────────────────
   The desktop app draws WEB-1 on a 1215 × 454 px grid (65 px keys, 2 px black lines).
   One key pitch (67 px) becomes 19.05 mm, the standard keyboard pitch, so 1 px = 0.2843 mm.
   X runs left→right, Z runs back (screen side) → front (player side), Y is up. */
const S = 19.05 / 67;
const DW = 1215, DH = 454;
const W = DW * S, D = DH * S;
const X = px => (px - DW / 2) * S;
const Z = py => (py - DH / 2) * S;
const PI = Math.PI;

// Heights (mm, 0 = underside of the case). The top of the case, the tiles and the screen are level with the keytops.
const FLOOR = 2.0, SPLIT = 9, PLATE_TOP = 14, PLATE_T = 1.2;   // 2 mm floor (1 mm under the battery pockets)
const PCB_TOP = 10.6, PCB_T = 1.6, PCB_BOT = PCB_TOP - PCB_T;
const CAP_BOT = PLATE_TOP + 3.4, CAP_H = 3.0, CAP_TOP = CAP_BOT + CAP_H;
const FRAME_TOP = CAP_TOP, POD_TOP = CAP_TOP, TILE_TOP = CAP_TOP, SCREEN_TOP = CAP_TOP, DISP_TOP = 7.8, FEET = 2.5;
const RING_R = 24 * S, RING_DEPTH = 0.8;   // concave centre inside each key ring (the app's 48 px ring)
const SOCK_BOT = PCB_BOT - 1.8;   // underside of the hot-swap sockets: everything below the PCB stays under this
const WALL = 3.0, R_CASE = 16 * S, GAP = 0.8;   // 3 mm walls
const SEAM = 34;                           // the case halves split in a gap between two cells (left half 207 mm wide: fits a 220 mm bed)
const OPEN = { x0: X(18), x1: X(1159), z0: Z(18), z1: Z(436), r: 8.5 * S }; // black plate opening

document.getElementById('dimtxt').textContent = `${W.toFixed(1)} × ${D.toFixed(1)} × ${CAP_TOP.toFixed(1)} mm`;

/* ───────────────────────── Controls taken from the app ───────────────────────── */
const INK = '#3a3b3d', ORANGE = '#ff6427', BLUE = '#3f7fe8', GREEN = '#2fb673', WHITE = '#f4f4ef';
const ICON = {

<h2>How it works</h2>
<p>WEB-1 is a web page, so the physical instrument runs the real app. A <b>Raspberry Pi Compute Module 5</b>, plugged in under the main PCB, runs <code>index.html</code> in Chromium in kiosk mode, and a small page (<code>hw.html</code>) shows only the app's screen on the 4.3" panel behind the window.</p>
<p>An <b>RP2040</b> on the main PCB (the Raspberry Pi Pico circuit, without the module) scans the 53 keys and 4 knob pushes as an 8 × 8 diode matrix. The function keys type the same keyboard shortcuts as the desktop app (Z X C V, B N M, 1–8, R, Space…), so they work with no change to WEB-1. The musical keys, the knobs and the volume send short lines over USB serial, which <code>hw.html</code> turns into presses and turns on the app's own controls. The same link sends the key lights and the level meter back to 34 RGB LEDs.</p>
<p>Sound goes over I²S to a <b>WM8960</b> codec on the PCB. It drives the OUT jack (line or headphones) and, through its own 1 W amplifier, the slim 40 mm speaker under the grille. It also records from the IN jack and from the built-in MEMS microphone under the four dots on the right rail.</p>
<p><b>Battery:</b> five 2000 mAh LiPo cells in parallel (10 000 mAh, 37 Wh) lie in a row under the keys. The synth draws about 5.3 W (CM5 running Chromium 3.5 W, display 0.9 W, LEDs 0.3 W, audio 0.4 W), about 5.8 W from the cells through the boost, so a full charge plays for <b>about 6 hours</b>: about 4.5 h with the CPU flat out, 7 h or more with the screen dimmed. A BQ25895 charges them at up to 3 A from the USB-C port (about 3.5 hours from empty) and boosts them to 5.1 V for the CM5; a MAX17048 reports the charge level, and a light beside the USB-C port shows charging. The ON/OFF slide switch on the right side cuts power to the CM5 but lets the cells keep charging.</p>
<p><b>Built to feel solid:</b> 3 mm walls and a 2 mm floor. The cells sit in 1 mm floor pockets between 1.2 mm fences, and the posts in the 7.2 mm gaps between them hold them sideways and carry the PCB; 18 supports in all. A 1.2 mm steel switch plate and a 4 mm steel plate at the back bring it to about 1.14 kg, with the centre of mass within 4 mm of the middle. The case halves join at a gap between two cells, tied by the back steel, a seam joiner and the steel plate. Poron foam between the PCB and the plate, foam on the floor and gaskets around the speaker, mic, cells and display take out the hollow click.</p>
<p>The keys use <b>Kailh Choc v2</b> switches: low-profile like Choc v1, but with the MX-style "+" cross stem, so the printed keycaps press onto a round socket with a cross hole.</p>
<h2>Fit notes</h2>
<p class="note"><b>Thin, flush case:</b> the top of the case, the speaker grille, the volume tile, the knob pods and the screen window are all level with the keytops, at ${FRAME_TOP.toFixed(1)} mm (${(CAP_TOP + FEET).toFixed(1)} mm with the feet). A Raspberry Pi 5 build needed about 27 mm of body plus the keys. Everything under the PCB stays below ${SOCK_BOT.toFixed(1)} mm, the underside of the hot-swap sockets: the CM5 on 4 mm connectors, the 5 mm cells on 0.5 mm foam in 1 mm floor pockets (their tops at 6.5 mm), the 4 mm steel weights and a 4.8 mm speaker. The RP2040, codec and charger are chips on the PCB itself.</p>
<p class="note">The trade-off is the main PCB: it has to carry the CM5 (power, USB-C, display connector), so it is a 4-layer board you design from Raspberry Pi's CM5 IO Board files rather than a simple matrix. For a plain Raspberry Pi 5, the case needs to be about 27 mm.</p>
<p class="note">The 4.3" panel is taller than the window, so it sits under the PCB, about ${(SCREEN_TOP - DISP_TOP).toFixed(1)} mm below the window, inside a black shroud (P12). The keys in front of the screen (MIXER and T1–T4) sit on the PCB above the lower part of the panel: solder those 5 switches without sockets and trim their pins flush. Check your panel's top border: the back wall gives it about 3 mm.</p>
<p class="note">Each light pipe sits 7.9 mm from the key centre, about 0.9 mm further out than the LED dot in the app, so it clears the 15 mm Choc housing.</p>`;

const SLOTNAMES = ['fx', 'tempo', 'metro', 'synth', 'drum', 'tape', 'mixer', 't0', 't1', 't2', 't3', 's0', 's1', 's2', 's3', 's4', 's5', 's6', 's7', 'seq', 'lift', 'drop', 'loop', 'rec', 'play', 'stop', 'left', 'right', 'shift',
  ...WHITE_SEMI.map(s => 'n' + s), ...BLACK_SEMI.map(s => 'n' + s), 'e0', 'e1', 'e2', 'e3'];
const fk = Object.fromEntries(FKEYS.map(k => [k.a, k]));
const slotRows = SLOTNAMES.map((n, i) => {
  let what, sends;
  if (fk[n]) { what = fk[n].name; sends = `key ${fk[n].hid}`; }
  else if (n[0] === 'n') { const s = +n.slice(1); what = `${NOTE[s % 12]}${s >= 12 ? '2' : '1'} (${NOTE[s % 12].length > 1 ? 'black' : 'white'} key)`; sends = `serial K ${s}`; }
  else { what = `${ENCS[+n[1]].name} knob push`; sends = `serial P ${n[1]}`; }
  return `<tr><td class="id">${i}</td><td>R${i >> 3} · C${i & 7}</td><td>${esc(what)}</td><td>${esc(sends)}</td></tr>`;
}).join('');

<p>J6 (JST-SH 10-pin) carries everything to the left side: pins 1–4 to the OUT jack (tip L, ring R, sleeve GND, switch contact as the headphone-detect line to the codec's GPIO, which turns the speaker off), pins 5–7 to the IN jack (L, R, GND, into LINPUT3 / RINPUT3), pins 9–10 to the speaker (a twisted pair from the codec's class-D outputs). The MEMS mic on the VU strip comes in on J8 to LINPUT1.</p>
